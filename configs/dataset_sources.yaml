  - id: rocov2
    priority: later_scale
    official_publication_url: https://www.nature.com/articles/s41597-024-03496-6
    official_distribution_url: https://zenodo.org/records/8333645
    observed_official_license: CC-BY-NC-4.0
    license_policy: verify_exact_version_not_mirror_label
