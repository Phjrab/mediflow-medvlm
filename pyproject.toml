[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediflow-medvlm"
version = "0.1.0"
description = "Research-oriented safety-first workflows for medical vision-language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Mediflow contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pillow>=10"]
data = ["pillow>=10", "pyarrow>=18", "PyYAML>=6"]
train = ["torch>=2.6", "torchvision>=0.21", "transformers>=5.3,<6", "peft>=0.18,<1", "accelerate>=1,<2", "safetensors>=0.4", "pillow>=10"]
quant = ["bitsandbytes>=0.45"]
device = ["paramiko>=3"]
report = ["matplotlib>=3.8"]

[project.scripts]
medvlm = "mediflow_medvlm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
